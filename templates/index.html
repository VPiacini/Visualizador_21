<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador — 21 Jogos no Mesmo Tabuleiro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div id="app">
    <nav id="game-selector">
      {% for g in games %}
        <button class="game-btn" data-game-id="{{ g.id }}">{{ g.name }}</button>
      {% endfor %}
    </nav>

    <header id="game-header">
      <h1 id="game-name"></h1>
      <p id="game-subtitle"></p>
      <button id="btn-load" class="pill-btn">Carregar partida</button>
      <button id="btn-template" class="pill-btn">Baixar modelo</button>
      <input id="file-load" type="file" accept=".json,application/json" hidden />
    </header>

    <div id="source-switch" role="group" aria-label="Origem da partida">
      <button id="src-livro" class="pill-btn">Livro</button>
      <button id="src-mine" class="pill-btn" hidden>Minha partida</button>
      <button id="src-remove" class="pill-btn" aria-label="Remover minha partida" title="Remover minha partida" hidden>&#10005;</button>
    </div>

    <div id="top-row">
      <div id="player-legend"></div>
    </div>

    <div id="board-frame">
      <div id="board"></div>
      <div id="rank-labels"></div>
      <div id="file-labels"></div>
    </div>

    <div id="controls">
      <button id="btn-prev" aria-label="Jogada anterior">&#8592;</button>
      <span id="move-counter"></span>
      <button id="btn-next" aria-label="Próxima jogada">&#8594;</button>
      <button id="btn-end" aria-label="Ir para o final">&#9197;</button>
      <button id="btn-reset" aria-label="Reiniciar">&#8635;</button>
      <button id="btn-play" aria-label="Reproduzir">&#9654;</button>
      <select id="play-speed" aria-label="Velocidade">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
      </select>
    </div>

    <div id="status-box"></div>
    <div id="notation-box"></div>
    <div id="comment-box"></div>
  </div>

  <script>
    window.DEFAULT_GAME_ID = "{{ default_game }}";
  </script>
  <script src="{{ url_for('static', filename='js/board.js') }}"></script>
</body>
</html>
